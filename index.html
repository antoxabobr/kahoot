<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Vocabulary Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f2f2f2;
            overflow: hidden; /* Prevent scrolling during gameplay */
        }
        
        .kahoot-bg {
            background-image: radial-gradient(circle at center, #864cbf 0%, #46178f 100%);
        }

        .shape-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.1;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 L90 90 L10 90 Z" fill="white"/></svg>'),
                              url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="white"/></svg>'),
                              url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="20" width="60" height="60" fill="white"/></svg>'),
                              url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,10 90,50 50,90 10,50" fill="white"/></svg>');
            background-position: 10% 20%, 80% 30%, 20% 80%, 70% 90%;
            background-repeat: no-repeat;
            background-size: 150px, 120px, 100px, 130px;
        }

        .btn-red { background-color: #e21b3c; border-bottom: 6px solid #b0102a; }
        .btn-red:active { border-bottom: 0px; transform: translateY(6px); }
        
        .btn-blue { background-color: #1368ce; border-bottom: 6px solid #0c4d9e; }
        .btn-blue:active { border-bottom: 0px; transform: translateY(6px); }
        
        .btn-yellow { background-color: #d89e00; border-bottom: 6px solid #a87b00; color: #333; }
        .btn-yellow:active { border-bottom: 0px; transform: translateY(6px); }
        
        .btn-green { background-color: #26890c; border-bottom: 6px solid #1a6108; }
        .btn-green:active { border-bottom: 0px; transform: translateY(6px); }

        .answer-shape {
            display: inline-block;
            width: 30px;
            height: 30px;
            margin-right: 15px;
            background-color: white;
            vertical-align: middle;
        }

        .shape-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .shape-diamond { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        .shape-circle { border-radius: 50%; }
        .shape-square { /* Default square */ }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            position: absolute;
            bottom: 0;
            left: 0;
        }
        
        .progress-bar {
            height: 100%;
            background-color: white;
            width: 100%;
            transition: width 1s linear;
        }

        .score-bubble {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Results Screen Animations */
        .podium-bar {
            animation: growUp 1s ease-out forwards;
            transform-origin: bottom;
            transform: scaleY(0);
        }

        @keyframes growUp {
            to { transform: scaleY(1); }
        }
    </style>
</head>
<body class="kahoot-bg text-white h-screen flex flex-col items-center justify-center relative">

    <div class="shape-bg"></div>

    <div id="start-screen" class="z-10 flex flex-col items-center w-full max-w-2xl px-4 text-center">
        <h1 class="text-6xl font-black mb-8 drop-shadow-md">Vocabulary Challenge!</h1>
        <p class="text-2xl mb-12 font-bold bg-white text-purple-900 px-6 py-3 rounded-lg shadow-lg inline-block">
            Subject Vocabulary
        </p>
        <button onclick="startQuiz()" class="bg-white text-gray-900 font-bold text-3xl py-4 px-12 rounded shadow-[0_6px_0_#ccc] active:shadow-[0_0px_0_#ccc] active:translate-y-[6px] transition-all">
            Enter
        </button>
    </div>

    <div id="quiz-screen" class="hidden z-10 w-full h-full flex flex-col px-4 pb-4 pt-8">
        
        <!-- Header: Counter & Score -->
        <div class="flex justify-between items-center mb-6 w-full max-w-5xl mx-auto">
            <div class="text-2xl font-bold bg-black/30 px-4 py-2 rounded-lg" id="question-counter">1 / 11</div>
            <div class="text-3xl font-black bg-black/30 px-6 py-2 rounded-lg" id="score-display">0</div>
        </div>

        <!-- Question Area -->
        <div class="flex-grow flex items-center justify-center mb-8 w-full max-w-5xl mx-auto">
            <h2 id="question-text" class="text-4xl md:text-5xl font-bold text-center leading-tight drop-shadow-md bg-white text-black p-8 rounded-lg w-full shadow-lg min-h-[150px] flex items-center justify-center">
                Question goes here?
            </h2>
        </div>

        <!-- Timer -->
        <div class="relative w-16 h-16 rounded-full bg-purple-900 border-4 border-white flex items-center justify-center mb-4 mx-auto shadow-lg">
            <span id="timer" class="text-2xl font-bold">20</span>
        </div>

        <!-- Answer Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-5xl mx-auto h-1/2 min-h-[300px]">
            <button class="answer-btn btn-red rounded shadow-lg text-left p-4 text-2xl font-bold flex items-center h-full break-words" onclick="selectAnswer(0)">
                <div class="answer-shape shape-triangle shrink-0"></div>
                <span id="ans-0-text" class="flex-grow">Answer 1</span>
            </button>
            <button class="answer-btn btn-blue rounded shadow-lg text-left p-4 text-2xl font-bold flex items-center h-full break-words" onclick="selectAnswer(1)">
                <div class="answer-shape shape-diamond shrink-0"></div>
                <span id="ans-1-text" class="flex-grow">Answer 2</span>
            </button>
            <button class="answer-btn btn-yellow rounded shadow-lg text-left p-4 text-2xl font-bold flex items-center h-full break-words" onclick="selectAnswer(2)">
                <div class="answer-shape shape-circle shrink-0"></div>
                <span id="ans-2-text" class="flex-grow">Answer 3</span>
            </button>
            <button class="answer-btn btn-green rounded shadow-lg text-left p-4 text-2xl font-bold flex items-center h-full break-words" onclick="selectAnswer(3)">
                <div class="answer-shape shape-square shrink-0"></div>
                <span id="ans-3-text" class="flex-grow">Answer 4</span>
            </button>
        </div>
        
        <!-- Visual Timer Bar at bottom -->
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <div id="feedback-screen" class="hidden z-20 absolute inset-0 flex flex-col items-center justify-center w-full h-full">
        <div id="feedback-bg" class="absolute inset-0 z-0"></div>
        <div class="z-10 text-center flex flex-col items-center">
            <h1 id="feedback-title" class="text-6xl font-black mb-4 drop-shadow-lg">Correct!</h1>
            <div id="feedback-points" class="bg-black/40 px-6 py-2 rounded-full text-2xl font-bold mb-8 hidden">+954</div>
            <div id="feedback-icon" class="text-8xl mb-8">✔</div>
            <p id="feedback-correct-answer" class="text-2xl font-bold bg-white text-black p-4 rounded-lg shadow-lg max-w-xl hidden"></p>
            <button id="next-btn" onclick="nextQuestion()" class="mt-8 bg-black/50 hover:bg-black/70 text-white font-bold py-3 px-8 rounded-full text-xl transition-colors">
                Next
            </button>
        </div>
    </div>

    <div id="results-screen" class="hidden z-10 w-full h-full flex flex-col items-center justify-center px-4 bg-[#46178f]">
        <h1 class="text-6xl font-black mb-2 text-yellow-400 drop-shadow-md">Podium</h1>
        <h2 class="text-2xl font-bold mb-12">Vocabulary Master</h2>
        
        <div class="flex items-end justify-center h-64 gap-4 w-full max-w-md">
            <!-- Podium -->
            <div class="w-1/3 flex flex-col items-center">
                <div class="text-2xl font-bold mb-2 score-bubble" id="final-score">0</div>
                <div class="bg-purple-600 w-full h-48 rounded-t-lg podium-bar flex justify-center pt-4 text-4xl font-black border-t-4 border-purple-400">1</div>
            </div>
        </div>
        
        <div class="mt-12 text-xl font-bold text-center">
            <p id="final-stats" class="mb-6 bg-black/30 p-4 rounded-lg">You got 11 out of 11 correct!</p>
            <button onclick="location.reload()" class="bg-white text-purple-900 font-bold py-3 px-8 rounded shadow-[0_4px_0_#ccc] active:translate-y-[4px] active:shadow-none transition-all">
                Play Again
            </button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What is a 'topic sentence'?",
                options: [
                    "The last sentence of a book.",
                    "The first sentence in a paragraph, often used to explain the key idea.",
                    "A sentence that asks a question.",
                    "A sentence containing a quote."
                ],
                correct: 1
            },
            {
                question: "If a text is arranged 'chronologically', how is it organized?",
                options: [
                    "In alphabetical order.",
                    "By level of importance.",
                    "In linear time order.",
                    "By geographic location."
                ],
                correct: 2
            },
            {
                question: "What does 'flashback' mean in literature?",
                options: [
                    "A bright light described in a scene.",
                    "When the narrator jumps out of the present to describe a past event.",
                    "A hint about what will happen later.",
                    "A sudden change in the weather."
                ],
                correct: 1
            },
            {
                question: "What does it mean to 'infer' something?",
                options: [
                    "To read between the lines based on hints.",
                    "To state a fact directly.",
                    "To find a word in a dictionary.",
                    "To summarize a paragraph."
                ],
                correct: 0
            },
            {
                question: "What are 'synonyms'?",
                options: [
                    "Words that sound the same but have different meanings.",
                    "Words that have opposite meanings.",
                    "Words that share the same meaning as other words.",
                    "Words that are spelled incorrectly."
                ],
                correct: 2
            },
            {
                question: "What are 'connotations'?",
                options: [
                    "The literal, dictionary definition of a word.",
                    "Ideas linked to a word; ideas that have become associated with a word.",
                    "Words used only in poetry.",
                    "Punctuation marks."
                ],
                correct: 1
            },
            {
                question: "What are 'quotations'?",
                options: [
                    "Words from a text.",
                    "Questions asked by the author.",
                    "The titles of chapters.",
                    "Footnotes at the bottom of a page."
                ],
                correct: 0
            },
            {
                question: "What are 'quotation marks' used for?",
                options: [
                    "To show possession.",
                    "To end a sentence.",
                    "Punctuation marks used to indicate where you have quoted.",
                    "To connect two independent clauses."
                ],
                correct: 2
            },
            {
                question: "What is 'direct speech'?",
                options: [
                    "Giving a presentation to an audience.",
                    "Words spoken by a character in a novel, play, or poem.",
                    "A conversation between two real people.",
                    "An author's note at the beginning."
                ],
                correct: 1
            },
            {
                question: "Who is the 'protagonist'?",
                options: [
                    "The villain or enemy.",
                    "The author of the book.",
                    "A minor background character.",
                    "The main character."
                ],
                correct: 3
            },
            {
                question: "What is a writer's 'intention'?",
                options: [
                    "The genre of the book.",
                    "The impact the author wants their writing to have on the reader.",
                    "The year the book was published.",
                    "The title they choose for the text."
                ],
                correct: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswers = 0;
        let timerInterval;
        let timeLeft = 20;
        let canAnswer = false;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const feedbackScreen = document.getElementById('feedback-screen');
        const resultsScreen = document.getElementById('results-screen');
        
        const questionText = document.getElementById('question-text');
        const counterDisplay = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');
        
        const answerButtons = [
            document.getElementById('ans-0-text'),
            document.getElementById('ans-1-text'),
            document.getElementById('ans-2-text'),
            document.getElementById('ans-3-text')
        ];
        const buttonContainers = document.querySelectorAll('.answer-btn');

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            canAnswer = true;
            const currentQuestion = quizData[currentQuestionIndex];
            questionText.innerText = currentQuestion.question;
            counterDisplay.innerText = `${currentQuestionIndex + 1} / ${quizData.length}`;
            
            // Randomize options for this specific load
            const shuffledIndices = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
            
            // We need to keep track of where the correct answer ended up
            let newCorrectIndex = 0;

            currentQuestion.options.forEach((option, index) => {
                const targetBtnIndex = shuffledIndices[index];
                answerButtons[targetBtnIndex].innerText = option;
                
                // Store the real correct index on the button container itself for easy checking
                if (index === currentQuestion.correct) {
                    buttonContainers[targetBtnIndex].dataset.isCorrect = "true";
                } else {
                    buttonContainers[targetBtnIndex].dataset.isCorrect = "false";
                }
            });

            // Reset UI
            buttonContainers.forEach(btn => {
                btn.style.opacity = "1";
                btn.disabled = false;
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = 20;
            timerDisplay.innerText = timeLeft;
            progressBar.style.width = '100%';
            
            // Small timeout to allow CSS transition to reset, then start animating down
            setTimeout(() => {
                progressBar.style.width = '0%';
                progressBar.style.transition = 'width 20s linear';
            }, 50);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function selectAnswer(buttonIndex) {
            if (!canAnswer) return;
            canAnswer = false;
            clearInterval(timerInterval);
            
            const selectedButton = buttonContainers[buttonIndex];
            const isCorrect = selectedButton.dataset.isCorrect === "true";
            
            // Dim unselected answers
            buttonContainers.forEach((btn, idx) => {
                if (idx !== buttonIndex) {
                    btn.style.opacity = "0.5";
                }
            });

            showFeedback(isCorrect);
        }

        function handleTimeOut() {
            canAnswer = false;
            showFeedback(false, true);
        }

        function showFeedback(isCorrect, isTimeout = false) {
            quizScreen.classList.add('hidden');
            feedbackScreen.classList.remove('hidden');
            
            const title = document.getElementById('feedback-title');
            const bg = document.getElementById('feedback-bg');
            const icon = document.getElementById('feedback-icon');
            const pointsEl = document.getElementById('feedback-points');
            const correctAnswerEl = document.getElementById('feedback-correct-answer');
            
            pointsEl.classList.add('hidden');
            pointsEl.classList.remove('score-bubble');
            correctAnswerEl.classList.add('hidden');

            if (isCorrect) {
                // Calculate points based on time (max 1000, min 500)
                const points = Math.floor(500 + (timeLeft / 20) * 500);
                score += points;
                correctAnswers++;
                scoreDisplay.innerText = score;
                
                title.innerText = "Correct!";
                bg.className = "absolute inset-0 z-0 bg-green-500";
                icon.innerText = "✔";
                
                pointsEl.innerText = `+${points}`;
                pointsEl.classList.remove('hidden');
                
                // Trigger animation reflow
                void pointsEl.offsetWidth;
                pointsEl.classList.add('score-bubble');

            } else {
                title.innerText = isTimeout ? "Time's Up!" : "Incorrect";
                bg.className = "absolute inset-0 z-0 bg-red-600";
                icon.innerText = "✖";
                
                // Show the correct answer
                const currentQuestion = quizData[currentQuestionIndex];
                const correctText = currentQuestion.options[currentQuestion.correct];
                correctAnswerEl.innerHTML = `<span class="text-gray-500 block text-sm mb-1">Correct Answer:</span> ${correctText}`;
                correctAnswerEl.classList.remove('hidden');
            }
        }

        function nextQuestion() {
            feedbackScreen.classList.add('hidden');
            currentQuestionIndex++;
            
            // Reset transition for progress bar immediately
            progressBar.style.transition = 'none';

            if (currentQuestionIndex < quizData.length) {
                quizScreen.classList.remove('hidden');
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            resultsScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-stats').innerText = `You got ${correctAnswers} out of ${quizData.length} correct!`;
        }
    </script>
</body>
</html>
